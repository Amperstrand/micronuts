# Gitleaks allowlist — every entry justified.
title = "micronuts gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Official Cashu NUT-13 spec test vectors (cashubtc/nuts tests/13-tests.md, published by the spec) and the canonical cross-implementation vectors (cashu-cross-vectors.json lineage) — byte-exact test material by design"
paths = [
  '''cashu-core-lite/src/nuts/nut13\.rs''',
  '''cashu-core-lite/tests/cross_vectors\.rs''',
]

[[allowlists]]
description = "Emitter token corpus (#78): bench-proven tokens from the PRTA lab minter (192.168.13.x, no custody value) plus envelopes synthesized around them with dummy C points. generic-api-key fires on the 'token:' field name + base64 entropy — byte-exact test material by design"
paths = [
  '''micronuts-wallet-core/tests/token_corpus\.rs''',
]

[[allowlists]]
description = "tools/hil/rig.py names the labgrid board alias with a *_KEY constant; generic-api-key fires on the name + literal. The value is a board name, not a credential (allowlist covers the pre-allow-comment history)"
regexes = ['''stm32f469i-disco''']
