[package]
name = "micronuts-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host Cashu wallet with a Slint UI (prototype)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cashu-core-lite = { path = "../cashu-core-lite", features = ["std"] }
hex = "0.4"
k256 = { workspace = true }
qrcodegen-no-heap = { workspace = true }
rand_core = { workspace = true, features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
slint = { version = "1.15", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
slint = { version = "1.15", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "compat-1-2",
    "unstable-fontique-07",
] }

[dev-dependencies]
micronuts-mint = { path = "../micronuts-mint" }
png = "0.17"

[build-dependencies]
slint-build = "1.15"
