[package]
name = "micronuts-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-independent business logic for Micronuts Cashu hardware wallet"

[dependencies]
cashu-core-lite = { path = "../cashu-core-lite" }
embedded-hal = { workspace = true }
embedded-graphics = { workspace = true }
rand_core = { workspace = true }
sha2 = { workspace = true }
heapless = { workspace = true }
gm65-scanner = { workspace = true }
qrcodegen-no-heap = { workspace = true }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
embassy-time = { workspace = true }
embassy-futures = { workspace = true }
# native_sim example only (optional so unit tests build without SDL2)
sdl2 = { version = "0.37", default-features = false, features = ["gfx"], optional = true }
libc = { version = "0.2", optional = true }
embassy-executor = { workspace = true, optional = true, features = ["platform-std", "executor-thread"] }

[features]
default = []
std = ["cashu-core-lite/std", "hex/std", "embassy-time/std"]
native-sim = ["std", "dep:sdl2", "dep:libc", "dep:embassy-executor"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
rand = "0.8"

[[example]]
name = "native_sim"
required-features = ["native-sim"]
