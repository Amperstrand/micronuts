[package]
name = "cashu-core-lite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal Cashu library for embedded systems (no_std + alloc)"

[dependencies]
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
k256 = { workspace = true }
sha2 = { workspace = true }
rand_core = { workspace = true }
minicbor = { workspace = true }

[dev-dependencies]
cashu = "0.17.3"
hex = "0.4"

[features]
default = ["transport-serial"]
std = ["hex/std", "rand_core/getrandom"]

# Transport feature flags for forward compatibility
# NOTE: These are compile-only flags. Only transport-serial is functional in v1.0.
# transport-usb-cdc and transport-microfips are placeholders for future hardware variants.
transport-serial = []
transport-usb-cdc = []
transport-microfips = []
