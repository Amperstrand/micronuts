[workspace]
resolver = "2"
members = [
    "firmware",
    "cashu-core-lite",
    "host-mint-tool",
    "micronuts-app",
    "micronuts-mint", "micronuts-fips-bridge", "micronuts-fips-responder", "walletport",
    "micronuts-audit-adapter",
]
exclude = ["micronuts-esp32-bridge", "micronuts-esp32-mint"]
default-members = ["firmware"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "0BSD"
repository = "https://github.com/Amperstrand/micronuts"
authors = ["Michael Fairman <mfairman@tegimeki.com>"]

[workspace.dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha2 = { version = "0.10", default-features = false }
rand_core = { version = "0.6", default-features = false }

minicbor = { version = "0.25", default-features = false, features = ["derive", "alloc"] }

cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
panic-halt = "1.0"
embedded-hal = "1.0"
embedded-graphics = "0.8.2"
embedded-io = "0.7.1"
embedded-io-async = "0.7"
gm65-scanner = { git = "https://github.com/Amperstrand/gm65-scanner", rev = "fa9b750", features = ["sync", "async", "defmt"] }
stm32-metapac = { version = "21", default-features = false, features = ["stm32f469ni"] }
embedded-hal-02 = { package = "embedded-hal", version = "0.2", features = ["unproven"] }
nb = "1.1"
qrcodegen-no-heap = "1.8.1"

# Embassy — from crates.io
embassy-time = { version = "0.5.1", features = ["tick-hz-32_768"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f469ni", "time-driver-any", "exti"] }
embassy-usb = { version = "0.6.0" }
embassy-usb-synopsys-otg = { version = "0.3.3" }
embassy-sync = { version = "0.8.0" }
embassy-futures = { version = "0.1.2" }

embassy-stm32f469i-disco = { git = "https://github.com/Amperstrand/embassy-stm32f469i-disco", rev = "1c0dd34" }

linked_list_allocator = "0.10.6"
static_cell = "2.1.1"
heapless = "0.8"
critical-section = "1.2"

[profile.release]
debug = true
lto = true
opt-level = "s"
strip = "none"
split-debuginfo = "off"
panic = "abort"


