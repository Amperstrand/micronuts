[package]
name = "micronuts-esp32-wallet"
version = "0.1.0"
edition = "2021"
license = "0BSD"
description = "ESP32 (esp-idf, std Rust) Cashu wallet — the nucula-mode device (micronuts#68 M1)"
publish = false

# Belt+braces with the .cargo/config.toml ESP_IDF_VERSION env pin
# (ccid-firmware-rs mechanism; Amperstrand v5.5.5 unification, 2026-10-12).
[package.metadata.esp-idf-sys]
esp_idf_version = "tag:v5.5.5"

[lib]
name = "micronuts_esp32_wallet"
path = "src/lib.rs"

[[bin]]
name = "micronuts-esp32-wallet"
path = "src/main.rs"

[[bin]]
name = "terminal_demo"
path = "src/bin/terminal_demo.rs"
required-features = ["display-cyd"]

[[bin]]
name = "terminal_kiosk"
path = "src/bin/terminal_kiosk.rs"
required-features = ["display-cyd"]

# M5 Atom (ESP32-PICO + 5x5 SK6812 on GPIO27) — the standing TollGate
# client (the NutBar C firmware is decommissioned; micronuts is the only
# embedded TollGate client). Scan-join-validate-pay-monitor loop, USB
# serial token funding, PRTA TG_* event lines.
[[bin]]
name = "tollgate_atom"
path = "src/bin/tollgate_atom.rs"

[features]
display-cyd = ["dep:mipidsi", "dep:embedded-graphics", "dep:qrcode"]
# M5StickC-Plus2 port (ST7789 135×240): same deps as display-cyd minus qrcode.
# See docs/PORT-M5STICK.md for the pin map and build instructions.
display-m5stick = ["dep:mipidsi", "dep:embedded-graphics"]

[dependencies]
# House pins (micronuts-esp32-mint, bolty-rs apps/bolty-esp32).
esp-idf-sys = { version = "0.38", features = ["binstart"] }
esp-idf-hal = "0.47"
esp-idf-svc = "0.53"
embedded-svc = "0.29"
log = "=0.4.29"
anyhow = "1"

cashu-core-lite = { path = "../cashu-core-lite", features = ["std"] }
micronuts-wallet-core = { path = "../micronuts-wallet-core" }
serde_json = "1"
# CYD terminal demo (feature-gated like bolty's display-st7789): mipidsi +
# embedded-graphics on the house pins (bolty-rs apps/bolty-esp32).
mipidsi = { version = "=0.9.0", optional = true }
embedded-graphics = { version = "=0.8.2", optional = true }
# Serial-umbilical terminal mode: on-device QR for LIVE invoices pushed
# over the rig serial (this CYD's radio is dead silicon — the rig is the
# network, micronuts#79).
qrcode = { version = "0.14", default-features = false, optional = true }

[build-dependencies]
embuild = { version = "=0.33.5", features = ["espidf"] }

# Patched hal (ccid-firmware-rs pattern): 0.46.2 + the
# sdmmc_host_t::unaligned_multi_block_rw_max_chunk_size initializer
# backported from 0.47.0 — required for the IDF v5.5.5 bindings.
[patch.crates-io]
esp-idf-hal = { path = "../vendor/esp-idf-hal" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.esp-idf-sys]
esp_idf_version = "tag:v5.5.5"
