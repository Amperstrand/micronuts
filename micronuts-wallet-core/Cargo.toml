[package]
name = "micronuts-wallet-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UI-free wallet core: engine, flows, state, wire protocol (shared by host, wasm, and ESP32 wallets)"

[dependencies]
cashu-core-lite = { path = "../cashu-core-lite", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
web-time = "1.1"
base64 = "0.22"
