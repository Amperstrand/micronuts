# House configuration (bolty-rs apps/bolty-esp32/.cargo/config.toml).
# Build from THIS directory (`cargo +esp build`): a workspace-root build
# resolves the wrong target and silently produces a host binary —
# verify artifacts with `file target/xtensa-esp32-espidf/*/micronuts-esp32-mint`.
[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["-C", "default-linker-libraries"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
ESP_IDF_VERSION = { value = "v5.2.4" } # ccid-firmware-rs pin
MCU = "esp32"
