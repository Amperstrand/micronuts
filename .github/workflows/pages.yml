name: Wallet Pages

on:
  push:
    branches: [main]
    paths:
      - 'micronuts-wallet/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.4

      - name: Build the browser wallet (wasm)
        run: trunk build --public-url /micronuts/
        working-directory: micronuts-wallet

      - uses: actions/upload-pages-artifact@v3
        with:
          path: micronuts-wallet/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: micronuts-wallet/e2e
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        working-directory: micronuts-wallet/e2e
        env:
          WALLET_URL: ${{ needs.deploy.outputs.page_url }}
          # Real-mint flow against testnut (auto-settling FakeWallet,
          # test money only) — the deployed wallet must genuinely talk
          # to a real Cashu mint.
          WALLET_E2E_REAL_MINT: "1"
