name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    env:
      # The repo's rust-toolchain.toml pins a nightly without rustfmt
      # installed; this job always runs stable rustfmt.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Workspace format check
        run: cargo fmt --all --check

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test cashu-core-lite
        run: cargo test -p cashu-core-lite --features std

      - name: Test walletport (gate validator + upstream-CDK interop)
        run: cargo test -p walletport

      - name: Test micronuts-mint
        run: cargo test -p micronuts-mint

      - name: Test micronuts-fips-bridge
        run: cargo test -p micronuts-fips-bridge

      - name: Demo smoke test
        run: |
          OUTPUT=$(cargo run -p micronuts-mint --bin demo 2>&1)
          echo "$OUTPUT" | grep "Demo complete" || (echo "Demo did not complete successfully" && exit 1)
          echo "$OUTPUT" | grep "Remaining balance: 36 sats" || (echo "Demo output mismatch" && exit 1)

      - name: Transport feature matrix
        run: |
          cargo build -p cashu-core-lite --no-default-features --features transport-serial
          cargo build -p cashu-core-lite --no-default-features --features transport-usb-cdc
          cargo build -p cashu-core-lite --no-default-features --features transport-microfips

  clippy:
    # Host-buildable crates only. micronuts-app/firmware pull the embassy
    # BSP whose executor needs an explicit platform feature on host —
    # their lint coverage is the firmware job's thumb-target clippy.
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2025-12-08
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-08
          components: clippy

      - name: Install USB system deps (host-mint-tool -> rusb -> libudev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev

      - name: Clippy (host crates, deny warnings)
        run: >
          cargo clippy -p cashu-core-lite -p walletport -p host-mint-tool
          -p micronuts-mint -p micronuts-fips-bridge -p micronuts-audit-adapter
          --all-targets -- -D warnings

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add thumbv7em-none-eabihf target
        run: rustup target add thumbv7em-none-eabihf

      - name: no_std library builds for Cortex-M
        run: cargo build -p cashu-core-lite -p walletport --target thumbv7em-none-eabihf

      - name: Build firmware for release
        run: cargo build -p firmware --release

      - name: Clippy on firmware (thumb target, baseline)
        # Baseline run: this job failed at build for 8 straight runs (a
        # Proof.dleq field fallout, hidden by continue-on-error), so its
        # warning state is unknown. Informational until shown clean —
        # then flip to -D warnings.
        run: cargo clippy -p firmware --target thumbv7em-none-eabihf -- -W clippy::all

  adapter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build audit adapter + mint_server (release)
        # The adapter spawns ./target/release/mint_server as a subprocess.
        run: cargo build -p micronuts-audit-adapter --release -p micronuts-mint --bin mint_server

      - name: Start adapter in background
        run: |
          ./target/release/micronuts-audit-adapter &
          ADAPTER_PID=$!
          echo "ADAPTER_PID=$ADAPTER_PID" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -s http://localhost:3030/v1/info > /dev/null 2>&1; then
              echo "Adapter is up"
              break
            fi
            sleep 1
          done

      - name: Smoke test /v1/info
        run: |
          RESPONSE=$(curl -s http://localhost:3030/v1/info)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'name' in d, 'missing name field'; print(f'Mint name: {d[\"name\"]}')"

      - name: Smoke test /v1/keys
        run: |
          RESPONSE=$(curl -s http://localhost:3030/v1/keys)
          echo "Response: $(echo $RESPONSE | head -c 200)..."
          echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'keysets' in d, 'missing keysets'; print(f'Keysets: {len(d[\"keysets\"])}')"

      - name: Smoke test /v1/keysets
        run: |
          RESPONSE=$(curl -s http://localhost:3030/v1/keysets)
          echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'keysets' in d, 'missing keysets'; ks=d['keysets'][0]; assert 'input_fee_ppk' in ks, 'missing input_fee_ppk'; print(f'Keyset fee: {ks[\"input_fee_ppk\"]}')"

      - name: Stop adapter
        if: always()
        run: |
          kill ${ADAPTER_PID} 2>/dev/null || true
          # Also kill any mint_server subprocess
          pkill -f mint_server 2>/dev/null || true

  deny:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace --all-features advisories bans
