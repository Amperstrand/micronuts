name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: file

      - name: Test cashu-core-lite
        run: cargo test -p cashu-core-lite --features std

      - name: Test micronuts-mint
        run: cargo test -p micronuts-mint

      - name: Test micronuts-fips-bridge
        run: cargo test -p micronuts-fips-bridge

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: file

      - name: Add thumbv7em-none-eabihf target
        run: rustup target add thumbv7em-none-eabihf

      - name: Build firmware for release
        run: cargo build -p firmware --release

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: file

      - name: Run clippy on workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run clippy on firmware
        run: cargo clippy -p firmware --target thumbv7em-none-eabihf -- -D warnings