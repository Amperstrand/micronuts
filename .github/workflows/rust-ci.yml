name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Workspace format check
        run: cargo fmt --all --check

  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Plain `cargo test` never prints a summary if a test wedges (the
      # microfips #178 lesson); nextest terminates hung tests per
      # .config/nextest.toml.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test cashu-core-lite
        run: cargo nextest run -p cashu-core-lite --features std

      - name: Test walletport (gate validator + upstream-CDK interop)
        run: cargo nextest run -p walletport

      - name: Test micronuts-mint
        run: cargo nextest run -p micronuts-mint

      - name: Test micronuts-mint (upstream backend feature)
        run: cargo nextest run -p micronuts-mint --features backend-upstream

      - name: Test micronuts-fips-bridge
        run: cargo nextest run -p micronuts-fips-bridge

      - name: Test micronuts-fips-responder (envelope adapter + segmentation)
        run: cargo nextest run -p micronuts-fips-responder

      - name: Test micronuts-app (host)
        # Tests use std items; a bare build has no embassy-time tick-hz.
        run: cargo nextest run -p micronuts-app --features std

      - name: Install wallet UI system deps (winit/fontconfig link deps; serialport -> libudev)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libudev-dev

      - name: Test micronuts-wallet (engine + REST transport)
        run: cargo nextest run -p micronuts-wallet

      - name: Wallet screen fixtures (UI regression hashes)
        # Trezor-style: hash every rendered screen and compare against the
        # committed screens.fixtures.tsv — recorded ON THE CI RUNNER (the
        # canonical environment: rendering uses its system fonts). On
        # mismatch the re-recorded fixtures + PNG diff are uploaded as the
        # 'screen-fixtures' artifact; commit it if the change is
        # intentional.
        run: |
          set +e
          cargo run -p micronuts-wallet --example shots
          STATUS=$?
          set -e
          SHOTS_RECORD=1 cargo run -q -p micronuts-wallet --example shots > /dev/null
          mkdir -p /tmp/screen-fixtures
          cp micronuts-wallet/screens.fixtures.tsv /tmp/screen-fixtures/
          cp target/shots/wallet-*.png /tmp/screen-fixtures/ 2>/dev/null || true
          echo "SCREEN_FIXTURES_STATUS=$STATUS" >> "$GITHUB_ENV"
          exit $STATUS

      - name: Upload screen fixtures artifact (on drift)
        if: always() && env.SCREEN_FIXTURES_STATUS != '0'
        uses: actions/upload-artifact@v4
        with:
          name: screen-fixtures
          path: /tmp/screen-fixtures/

      - name: Device journey fixtures (UI regression hashes, command-path driven)
        # Same Trezor model, driven through handle_command on a
        # deterministic in-process device: the screen each command renders
        # is hashed. Fully deterministic (compiled-in fonts, fixed seeds)
        # — no CI-canonical environment needed. On drift the re-recorded
        # fixtures + PNGs upload as the 'journey-fixtures' artifact.
        run: |
          set +e
          cargo run -p micronuts-app --example journey --features std
          STATUS=$?
          set -e
          SHOTS_RECORD=1 cargo run -q -p micronuts-app --example journey --features std > /dev/null
          mkdir -p /tmp/journey-fixtures
          cp micronuts-app/screens.fixtures.tsv /tmp/journey-fixtures/
          cp target/shots/journey-*.png /tmp/journey-fixtures/ 2>/dev/null || true
          echo "JOURNEY_FIXTURES_STATUS=$STATUS" >> "$GITHUB_ENV"
          exit $STATUS

      - name: Upload journey fixtures artifact (on drift)
        if: always() && env.JOURNEY_FIXTURES_STATUS != '0'
        uses: actions/upload-artifact@v4
        with:
          name: journey-fixtures
          path: /tmp/journey-fixtures/

      - name: Demo smoke test
        run: |
          OUTPUT=$(cargo run -p micronuts-mint --bin demo 2>&1)
          echo "$OUTPUT" | grep "Demo complete" || (echo "Demo did not complete successfully" && exit 1)
          echo "$OUTPUT" | grep "Remaining balance: 36 sats" || (echo "Demo output mismatch" && exit 1)

      - name: Swap script selftest (same script as the hardware leg)
        # The Trezor device-test pattern: the identical swap script runs
        # in CI against an in-process device; `mint-tool swap --port` runs
        # it against real silicon (exit 77 without a CDC device).
        run: cargo run -q -p host-mint-tool -- swap --selftest

      - name: QR handoff selftest (browser-engine token → device → offline gate)
        # The full browser→device handoff chain, CI leg: the wasm wallet's
        # engine + embedded mint mint a real token, the in-process device
        # swaps it through the pinned-key DLEQ gate, and the export opens
        # the walletport offline gate. `--wire` runs the same script
        # against real silicon.
        run: bash scripts/test_qr_handoff.sh

      - name: Transport feature matrix
        run: |
          cargo build -p cashu-core-lite --no-default-features --features transport-serial
          cargo build -p cashu-core-lite --no-default-features --features transport-usb-cdc
          cargo build -p cashu-core-lite --no-default-features --features transport-microfips

      - name: Feature-gate compile matrix (cfg-rot guard, #64)
        # Every feature-flag combination that can be host-built compiles:
        # bare no_std core, walletport/std (not enabled by any other crate),
        # so feature-gated code cannot rot uncompiled. micronuts-app's
        # shipped config compiles via the firmware job (thumb, no-default).
        run: |
          cargo build -p cashu-core-lite --no-default-features
          cargo build -p walletport --features std

  wallet-e2e:
    # PR-time browser e2e: build the wasm wallet, serve it locally, run
    # the SAME Playwright specs the Wallet Pages workflow runs post-deploy
    # (specs take WALLET_URL; the real-mint suite self-skips without
    # WALLET_E2E_REAL_MINT). This is the TDD feedback loop for user
    # stories; the Pages post-deploy run stays the release gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.21.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
        working-directory: micronuts-wallet/e2e

      - run: npx playwright install --with-deps chromium
        working-directory: micronuts-wallet/e2e

      - name: Build the browser wallet (wasm)
        run: trunk build
        working-directory: micronuts-wallet

      # python3.12 on ubuntu-latest serves .wasm as application/wasm.
      - name: Serve the build and run the e2e suite
        working-directory: micronuts-wallet/e2e
        env:
          WALLET_URL: http://127.0.0.1:8099/
        run: |
          python3 -m http.server 8099 --directory ../dist &
          SERVER=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8099/ >/dev/null && break
            sleep 1
          done
          npx playwright test
          STATUS=$?
          kill $SERVER
          exit $STATUS

  clippy:
    # Host-buildable crates. firmware pulls the embassy BSP (cortex-m
    # executor platform) — its lint coverage is the firmware job's
    # thumb-target clippy. micronuts-app is host-clippy'd under `std`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install USB system deps (host-mint-tool -> rusb -> libudev; wallet UI -> winit/fontconfig)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev libxkbcommon-dev libfontconfig1-dev

      - name: Clippy (host crates, deny warnings)
        run: >
          cargo clippy -p cashu-core-lite -p walletport -p host-mint-tool
          -p micronuts-mint -p micronuts-fips-bridge -p micronuts-fips-responder
          -p micronuts-audit-adapter -p micronuts-wallet
          --all-targets -- -D warnings

      - name: Clippy (micronuts-app, host std, deny warnings)
        run: cargo clippy -p micronuts-app --features std --all-targets -- -D warnings

      - name: Clippy (micronuts-mint upstream feature, deny warnings)
        run: cargo clippy -p micronuts-mint --all-targets --features backend-upstream -- -D warnings

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stable since 2026-09-02 (#48): the old "stable trips
      # rust_eh_personality with LTO + panic=abort" failure no longer
      # reproduces — release, debug, and thumb clippy all link cleanly.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: clippy

      - name: no_std library builds for Cortex-M
        run: cargo build -p cashu-core-lite -p walletport --target thumbv7em-none-eabihf

      - name: Build firmware (release)
        run: cd firmware && cargo build --release

      - name: Clippy on firmware (thumb target)
        run: cd firmware && cargo clippy --target thumbv7em-none-eabihf -- -D warnings

  adapter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install wallet UI system deps (slint link deps)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev libxkbcommon-dev libfontconfig1-dev

      - name: Build audit adapter + mint_server + wallet (release)
        # The adapter spawns ./target/release/mint_server as a subprocess.
        run: cargo build --release -p micronuts-audit-adapter -p micronuts-mint --bin micronuts-audit-adapter --bin mint_server -p micronuts-wallet --bin micronuts-wallet

      - name: Start adapter in background
        run: |
          # The adapter spawns target/debug/mint_server by default; we
          # built release — point it there explicitly.
          export MICRONUTS_MINT_BIN=$PWD/target/release/mint_server
          nohup ./target/release/micronuts-audit-adapter > adapter.log 2>&1 &
          ADAPTER_PID=$!
          echo "ADAPTER_PID=$ADAPTER_PID" >> $GITHUB_ENV
          for i in $(seq 1 30); do
            if curl -s http://localhost:3030/v1/info > /dev/null 2>&1; then
              echo "Adapter is up"
              exit 0
            fi
            sleep 1
          done
          echo "=== adapter never came up; adapter.log ==="
          cat adapter.log || true
          echo "=== listening sockets ==="
          ss -ltnp 2>/dev/null || true
          exit 1

      - name: Smoke test /v1/info
        run: |
          RESPONSE=$(curl -s http://localhost:3030/v1/info)
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'name' in d, 'missing name field'; print(f'Mint name: {d[\"name\"]}')"

      - name: Smoke test /v1/keys
        run: |
          RESPONSE=$(curl -s http://localhost:3030/v1/keys)
          echo "Response: $(echo $RESPONSE | head -c 200)..."
          echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'keysets' in d, 'missing keysets'; print(f'Keysets: {len(d[\"keysets\"])}')"

      - name: Smoke test /v1/keysets
        run: |
          RESPONSE=$(curl -s http://localhost:3030/v1/keysets)
          echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'keysets' in d, 'missing keysets'; ks=d['keysets'][0]; assert 'input_fee_ppk' in ks, 'missing input_fee_ppk'; print(f'Keyset fee: {ks[\"input_fee_ppk\"]}')"

      - name: Wallet demo ladder (mint → send → receive → melt)
        run: |
          OUTPUT=$(MICRONUTS_WALLET_MINT=http://localhost:3030 ./target/release/micronuts-wallet --demo 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep "STEP 6 OK" || (echo "wallet demo did not complete" && exit 1)
          echo "$OUTPUT" | grep "Final balance: 70 sats" || (echo "wallet demo balance mismatch" && exit 1)

      - name: Stop adapter
        if: always()
        run: |
          kill ${ADAPTER_PID} 2>/dev/null || true
          # Also kill any mint_server subprocess
          pkill -f mint_server 2>/dev/null || true

  speccheck:
    # Spec-quote drift: verbatim NUT quotes in cashu-core-lite source
    # verified against cashubtc/nuts HEAD. Drift fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install greatspectations
        run: pip install git+https://github.com/rustyrussell/greatspectations.git
      - name: Clone NUT specs
        # Pinned ref (#66): a floating HEAD clone breaks both ways — upstream
        # doc edits fail CI with no diff baseline (the microfips #180 lesson),
        # and it can disagree with the gitignored local clone, so a quote
        # passes locally and fails in CI. Bump deliberately, never track the
        # branch.
        run: |
          git init cashu-core-lite/nuts
          git -C cashu-core-lite/nuts remote add origin https://github.com/cashubtc/nuts.git
          git -C cashu-core-lite/nuts fetch --depth=1 origin a845dfc998abae501fc3419592d53dc995d34b12
          git -C cashu-core-lite/nuts checkout FETCH_HEAD
      - name: Spec-quote drift check
        run: >
          cd cashu-core-lite &&
          FILES=$(find src -name "*.rs" -not -name "*_test.rs") &&
          greatspectate check --config specquotes.toml
          --comment-start "// " --comment-continue "//"
          --comment-aside "// Note:" $FILES

  cashuts-conformance:
    # Real-wallet conformance (graduation of the 2026-09-04 wire finding):
    # the token wire format is judged by @cashu/cashu-ts — a consumer
    # OUTSIDE this repo — on every push, so it can't silently regress
    # against a real wallet again. Selftest proves the cashu-ts surface
    # decodes the NUT-00 V4 spec example; the TOKEN leg feeds it a
    # demo-keyset token minted in-process by the print_token example
    # (16/4/1, DLEQ on every proof). Runners have no sibling cashu-cf
    # checkout — install the verifier into a scratch node_modules root
    # and point CASHU_CF_ROOT at it (createRequire only needs that).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install cashu-ts (the external verifier)
        run: |
          mkdir -p target/cashu-verifier
          echo '{"name":"cashu-verifier","private":true}' > target/cashu-verifier/package.json
          npm install --prefix target/cashu-verifier @cashu/cashu-ts@^4.10 --no-audit --no-fund
      - name: cashu-ts surface selftest (NUT-00 V4 spec example)
        run: node scripts/e2e_cashuts_conformance.mjs --selftest
        env:
          CASHU_CF_ROOT: ${{ github.workspace }}/target/cashu-verifier
      - name: Mint a demo-keyset token and judge it with the real wallet
        run: |
          TOKEN=$(cargo run --release -q -p walletport --example print_token)
          TOKEN="$TOKEN" node scripts/e2e_cashuts_conformance.mjs
        env:
          CASHU_CF_ROOT: ${{ github.workspace }}/target/cashu-verifier

  deny:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Advisories + bans
        run: cargo deny --workspace --all-features check advisories bans

      # Gate-2 W5: the ESP crates are excluded from the workspace, so the
      # root deny run never traverses them — check them by manifest path
      # (both inherit the root deny.toml; locks are committed).
      # (micronuts-esp32-bridge was removed by the 2026-09-11
      # modularity audit; only the mint front-end remains.)
      - name: Advisories + bans (ESP crate)
        run: |
          cargo deny --manifest-path micronuts-esp32-mint/Cargo.toml check advisories bans

  esp32-build:
    # Cross-build the ESP32 (esp-idf std) mint front-end. ccid-firmware-rs
    # pattern: espup + cached Espressif tools + cargo +esp, built from the
    # crate directory (NOT the workspace root — wrong target resolution).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install espup + espflash + ldproxy
        # ldproxy is NOT installed by espup — it's the linker our
        # .cargo/config.toml selects for xtensa-esp32-espidf.
        run: cargo install --locked espup espflash ldproxy

      - name: Install Xtensa ESP toolchain
        # espup queries the GitHub API for the latest Xtensa Rust version;
        # unauthenticated that 403s (rate limit) on shared runner IPs.
        # Documented CI usage: provide GITHUB_TOKEN.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: espup install

      - name: Cache Espressif tools
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: espressif-${{ runner.os }}-v1

      - name: Build micronuts-esp32-mint (Xtensa)
        shell: bash
        working-directory: micronuts-esp32-mint
        env:
          # #58: credential consts fail closed at build time without env.
          MICRONUTS_WIFI_SSID: ci
          MICRONUTS_WIFI_PASS: ci
        run: |
          . $HOME/.espressif/esp-idf-v5.2.4/export-esp.sh 2>/dev/null || . $HOME/export-esp.sh
          cargo +esp build --locked
          file target/xtensa-esp32-espidf/debug/micronuts-esp32-mint | tee /dev/stderr | grep -q Xtensa

      - name: Source scan — no demo-keyset constructors on the device (#56)
        # The served keyset must come from the NVS-persisted seed, never
        # the public one baked into DemoMint::new(). Construction-level
        # guarantee: the device crate never references the demo-keyset
        # constructors (with_keyset_seed is always chained in main.rs).
        shell: bash
        run: |
          SCAN=$(grep -rn "demo_default\|demo_with_fee\|micronuts-demo-mint-seed" \
            micronuts-esp32-mint/src || true)
          if [ -n "$SCAN" ]; then
            echo "FAIL: demo-keyset references found in the device crate:"; echo "$SCAN"; exit 1
          fi
          echo "OK: no demo-keyset references in micronuts-esp32-mint/src"

      - name: Binary scan — no placeholder credentials in artifacts (#58)
        shell: bash
        run: |
          SCAN=$(grep -rl "YOUR_SSID\|YOUR_PASSWORD" \
            micronuts-esp32-mint/target/xtensa-esp32-espidf/debug || true)
          if [ -n "$SCAN" ]; then
            echo "FAIL: placeholder credential markers found in: $SCAN"; exit 1
          fi
          echo "OK: no placeholder credential markers in ESP artifacts"

      - name: Verify artifact architecture (anti-host-binary guard)
        shell: bash
        working-directory: micronuts-esp32-mint
        run: |
          ARCH=$(file target/xtensa-esp32-espidf/debug/micronuts-esp32-mint)
          case "$ARCH" in
            *Xtensa*) echo "OK: $ARCH" ;;
            *) echo "FAIL: artifact is not Xtensa: $ARCH"; exit 1 ;;
          esac
